name: Deploy to Google Apps Script

on:
  push:
    branches: [main]
    paths:
      - "*.gs"
      - "appsscript.json"
      - "package*.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm install -g @google/clasp
      - name: Authenticate clasp
        run: printf '%s' '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
      - run: clasp push --force
      - name: Create GAS version
        run: |
          GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "untagged")
          GIT_MSG=$(git log -1 --format='%s')
          GAS_VERSION=$(clasp version "${GIT_TAG}: ${GIT_MSG}" | grep -oE '[0-9]+$')
          echo "### GAS Version" >> "$GITHUB_STEP_SUMMARY"
          echo "| Git tag | GAS version |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ------- | ----------- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${GIT_TAG}\` | ${GAS_VERSION} |" >> "$GITHUB_STEP_SUMMARY"
